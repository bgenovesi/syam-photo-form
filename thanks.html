<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Thank you — Remembering Syam</title>
<style>
  :root { --ivory: #faf7f1; --ink: #211d18; --muted: #6f675c; --gold: #a98548; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--ivory); color: var(--ink); line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 96px 24px 48px; text-align: center; }
  .candle {
    width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle, #f5c86e 0%, #e8a94e 45%, rgba(232,169,78,0) 70%);
    margin: 0 auto 24px;
    box-shadow: 0 0 24px 8px rgba(232,169,78,.45);
    animation: flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.12); opacity: 1; } }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(30px, 6vw, 42px); margin-bottom: 14px; }
  p { color: var(--muted); font-size: 17px; max-width: 440px; margin: 0 auto 12px; }
  p.note { font-size: 14px; }
  a.back { display: inline-block; margin-top: 26px; color: var(--gold); font-size: 15px; }
  footer { margin-top: 60px; color: var(--muted); font-size: 14px; font-family: Georgia, serif; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <div class="candle" aria-hidden="true"></div>
  <h1>Thank you</h1>
  <p>Your photos are on their way, and they&rsquo;ll be part of the montage celebrating Syam.</p>
  <p class="note">If you have more you&rsquo;d like to share, you&rsquo;re welcome to submit again.</p>
  <a class="back" href="./">Share more photos</a>
  <footer>Forever in our hearts.</footer>
</div>
</body>
</html>
